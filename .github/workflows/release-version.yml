name: Release version

on:
  push:
    branches: [ main ]

# Writes vop_interwoven/_version.py and tags vX.Y.Z from the commit messages
# since the last vX.Y.Z tag (tools/analysis_version.py bump):
#   any breaking declaration -> MAJOR; else feat -> MINOR;
#   else fix/perf/refactor -> PATCH; else no release.
# The first run after this workflow lands finds no vX.Y.Z tag and only tags the
# version already in the file as the baseline.
#
# The release commit is pushed with GITHUB_TOKEN, which does not trigger
# workflows, so it cannot loop. If main moved during the run the push is
# rejected and this run fails; the next push to main computes from the same
# tag and includes everything, so nothing is lost.

permissions:
  contents: write

concurrency:
  group: release-version
  cancel-in-progress: false

jobs:
  release-version:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decide the release
        id: decide
        run: python tools/analysis_version.py bump --write --github-output "$GITHUB_OUTPUT"

      - name: Tag the baseline
        if: steps.decide.outputs.action == 'baseline'
        run: |
          git tag "${{ steps.decide.outputs.tag }}"
          git push origin "${{ steps.decide.outputs.tag }}"

      - name: Commit, tag and push the release
        if: steps.decide.outputs.action == 'bump'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add vop_interwoven/_version.py
          git commit -m "chore(release): ${{ steps.decide.outputs.tag }}" \
                     -m "Analysis-Impact: none"
          git tag "${{ steps.decide.outputs.tag }}"
          git push --atomic origin HEAD:main "${{ steps.decide.outputs.tag }}"
