name: Tests

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      # tests/dynamo/ stays out: it needs a live Revit document and is gated
      # behind VOP_RUN_DYNAMO_TESTS=1 by tests/conftest.py. Most of that tree
      # raises "Not running in Revit/Dynamo" at collection, so enabling it here
      # would report errors that say nothing about the change under review.
      - name: Run the test suite
        run: python -m pytest tests/ -q
