name: update-maps-on-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-maps:
    runs-on: ubuntu-latest

    # Don't run on bot-triggered sync loops or fork PRs, but do allow manual dispatch.
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action != 'closed' || github.event.pull_request.merged == true)
      ))

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          # On merge (closed+merged), update the base branch; otherwise update the PR branch.
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref || github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate maps
        working-directory: vop_interwoven
        run: |
          python ../tools/gen_maps.py

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add vop_interwoven/vop_interwoven_code_map_authoritative.md
            git add vop_interwoven/vop_interwoven_trace_map.md
            git add vop_interwoven/vop_interwoven_symbol_index.md
            git commit -m "chore: update navigation maps"
            git push
          else
            echo "No map changes."
          fi
